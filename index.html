<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسابقة سورة البقرة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23342c;--mut:#6b7a72;--g:#1f6b4f;--r:#b3402f;--line:#e2d8c3;--acc:#c9a04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13201b;--card:#1b2c25;--ink:#ece6d6;--mut:#9db0a6;--g:#4cc38f;--r:#ef7a68;--line:#2c4238;--acc:#d9b25c}}
:root[data-theme="dark"]{--bg:#13201b;--card:#1b2c25;--ink:#ece6d6;--mut:#9db0a6;--g:#4cc38f;--r:#ef7a68;--line:#2c4238;--acc:#d9b25c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif;height:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}
header{text-align:center;padding:10px 0 18px}
h1{margin:0;font-size:2rem;color:var(--g)}
.halaqa{margin-top:6px;font-size:1.25rem;color:var(--acc);font-weight:700}
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;justify-content:center}
.tab{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 18px;font-size:1.1rem;font-family:inherit;cursor:pointer}
.tab.active{background:var(--g);border-color:var(--g);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 16px;font-size:1.1rem}
button{font-family:inherit;cursor:pointer}
.reset{background:var(--r);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-size:1rem}
.grid{display:grid;gap:14px}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:4px solid var(--acc)}
.card.ok{border-top-color:var(--g)}.card.no{border-top-color:var(--r)}
.num{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:0 12px;font-size:1rem}
.ayah{font-size:1.7rem;line-height:2.1;text-align:center;margin:10px 0 4px}
.ref{text-align:center;color:var(--mut);font-size:.95rem;margin-bottom:12px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:1.1rem}
.btns .y.on{background:var(--g);border-color:var(--g);color:#fff}
.btns .n.on{background:var(--r);border-color:var(--r);color:#fff}
.face{min-height:130px;display:flex;flex-direction:column;justify-content:center}
.tap{text-align:center;font-size:1.3rem;color:var(--mut);line-height:1.9;border:2px dashed var(--acc);border-radius:12px;padding:26px 8px;margin:10px 0 12px}
.result{margin-top:18px;text-align:center;font-size:1.3rem;font-weight:700;color:var(--g)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>مسابقة سورة البقرة</h1>
<div class="halaqa">حلقة الشيماء بنت الحارث</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="bar"><span id="score">أكملت: 0 من 6</span><button class="reset" id="reset">إعادة 🔁</button></div>
<div class="grid" id="grid"></div>
<div class="result" id="result"></div>
</div>
<script>
const GROUPS=[
[
["ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِلْمُتَّقِينَ",2],
["يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ",21],
["وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً",30],
["وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا",34],
["يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ",40],
["أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُمْ",44]
],
[
["وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ",45],
["وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ",127],
["فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ",152],
["وَلَا تَقُولُوا لِمَنْ يُقْتَلُ فِي سَبِيلِ اللَّهِ أَمْوَاتٌ",154],
["وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ",155],
["وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ لَا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ",163]
],
[
["يَا أَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا",168],
["يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ",183],
["وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ",186],
["وَاذْكُرُوا اللَّهَ فِي أَيَّامٍ مَعْدُودَاتٍ",203],
["اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",255],
["لَا إِكْرَاهَ فِي الدِّينِ ۖ قَدْ تَبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ",256]
],
[
["اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ",257],
["مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ",261],
["قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى",263],
["يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى",282],
["آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ",285],
["لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",286]
]
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let current=0;
const shownAll=GROUPS.map(g=>Array(g.length).fill(false));
const stateAll=GROUPS.map(g=>Array(g.length).fill(null));

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  GROUPS.forEach((_,gi)=>{
    const b=document.createElement('button');
    b.className='tab'+(gi===current?' active':'');
    b.textContent='المجموعة '+AR(gi+1);
    b.onclick=()=>{current=gi;render()};
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const picks=GROUPS[current],shown=shownAll[current],state=stateAll[current];
  const g=document.getElementById('grid');g.innerHTML='';
  picks.forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='card'+(state[i]===true?' ok':state[i]===false?' no':'');
    c.innerHTML=`<span class="num">البطاقة ${AR(i+1)}</span>
    <div class="face">${shown[i]?`<div class="ayah">﴿ ${p[0]} ﴾</div><div class="ref">سورة البقرة – الآية ${AR(p[1])}</div>`:'<div class="tap">👆<br>اضغطي على البطاقة لإظهار الآية</div>'}</div>
    <div class="btns"><button class="y ${state[i]===true?'on':''}">✓ أكملت المقطع</button><button class="n ${state[i]===false?'on':''}">✗ لم تكمل</button></div>`;
    c.onclick=()=>{shown[i]=!shown[i];render()};
    c.querySelector('.y').onclick=e=>{e.stopPropagation();state[i]=state[i]===true?null:true;render()};
    c.querySelector('.n').onclick=e=>{e.stopPropagation();state[i]=state[i]===false?null:false;render()};
    g.appendChild(c);
  });
  const ok=state.filter(x=>x===true).length,total=picks.length,done=state.filter(x=>x!==null).length;
  document.getElementById('score').textContent=`أكملت: ${AR(ok)} من ${AR(total)}`;
  document.getElementById('result').textContent=done===total?`النتيجة النهائية: ${AR(ok)} / ${AR(total)} 🌟`:'';
}
document.getElementById('reset').onclick=()=>{
  shownAll.forEach(a=>a.fill(false));
  stateAll.forEach(a=>a.fill(null));
  render();
};
render();
</script>
</body>
</html>
